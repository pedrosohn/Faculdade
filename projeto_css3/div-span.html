<!DOCTYPE html>
<html>
<head>
    <title>Divs e Spans</title>
    <meta charset="UTF-8">
    <style type="text/css">
        #topo {
            background: grey;
        }
        #conteudo {
            background: red;
        }
        #rodape {
            background: gray;
        }
        #assinatura {
            background: pink;
        }
        .produto {
            background: green;
            margin: 10px;
        }
        .amarelo {
            color: yellow;
        }

    </style>
</head>
<body>
    <div>
    <div id="topo">
        <img src="amazon.jpg" width="200">
        <ul>
            <li>Home</li>
            <li>Quem somos</li>
            <li>Contato</li>
        </ul>
    </div>
    <div id="conteudo">
        <div class="produto">Produto 1</div>
        <div class="produto">Produto 2</div>
        <div class="produto">Produto 3</div>
    </div>
    </div>

    <div id="rodape">
        Todos os <span class="amarelo"> direitos </span> reservados
    </div>
    <span id="assinatura">
        Regiano 
    </span>
    <span>
        S. Alves
    </span>
</body>
</html>
