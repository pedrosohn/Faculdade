<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Formulário de Contato</h2>
    <form>
        Nome Completo:<br>
        <input type="text" name="nome" placeholder="Seu seu nome completo"><br><br>
        E-mail:<br>
        <input type="email" name="email" placeholder="exemplo@dominio.com"><br><br>
        Telefone:<br>
        <input type="password" name="senha"><br><br>
        Idade:<br>
        <input type="number"><br><br>
        Data de Nascimento:<br>
        <input type="date" name="data_nascimento"><br><br>
        Cor Favorita:<br>
        <input type="color" name="cor_favorita"><br><br>
        Aceite os termos: <input type="checkbox" name="termos"><br><br>
        Gênero:
        <input type="radio" name="genero" value="masculino">Masculino
        <input type="radio" name="genero" value="feminino">Feminino
        <input type="radio" name="genero" value="outro">Outro<br><br>

        Comentarios:
     <textarea name="comentarios" rows="4" cols="50"></textarea>
            <input type="submit" value="Enviar">
    </form>
</body>
</html>
