<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fontes e Cores</title>
    <style type="text/css">

        .formatacao{
            color: blue;
        }
        .formatacao2{
            color: blue;
            font-size: 30px;
            background: #53EAFD;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        .formatacao3{
            color: blue;
            font-size: 30px;
            font-family: "Palatino Linotype", "Book Antiqua",
            Palatino, serif, sans-serif
        }
        .texto{
            font-size: 30px;
        }
        .texto2{
            font-size: 1em;
        }
    </style>
</head>
<body>
    <p class="formatacao">Conteúdo</p>
    <br>
    <p class="formatacao2">Conteúdo</p>
    <br>
    <p class="formatacao3">Conteúdo</p>
    <br>
    <p class="texto">Conteúdo</p>
    <p>Texto padrão possui 16px</p>
</body>
</html>
